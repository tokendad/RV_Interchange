# Ground-truth fixture
#
# Hand-written expected records for the five physically-in-hand parts.
# The pipeline must reproduce these. Write these BEFORE designing the schema —
# the schema is then "what shape holds these records."
#
# component_id values here are placeholders. Real IDs are opaque and assigned
# at ingest. What matters is the relationships, not the strings.
#
# Confidence values reflect the honest day-1 state: prior only, no field evidence.
#
# Created: 2026-07-29
# Last evidence update: 2026-08-01 (Coleman thermostat resolver inputs, obs #43-#47)

part_types:
  - id: 412
    label: water heater
    compat_mode: attribute
    # CORRECTED 2026-07-30 by Suburban's Master Service and Training Manual (obs #19).
    # The installation opening is TWO-DIMENSIONAL. Figure 1 specifies A and B only —
    # there is no third cutout dimension. `cutout_d` was never a real attribute; both
    # retailers that published one were making a category error (see VENDOR-Suburban.md 6.5).
    critical_attributes: [opening_h, opening_w, capacity_gal, ignition_type]
    secondary_attributes: [unit_depth]   # cavity-depth constraint, NOT part of the opening
    tolerances:
      # Manufacturer-specified. Note the asymmetry on the small opening — an opening may
      # be oversize but must NEVER be undersize. A symmetric matcher would get this wrong.
      opening_4_6_gal:      {nominal_in: 12.75,  plus_in: 0.125, minus_in: 0.0}
      opening_10_12_16_gal: {nominal_in: 16.375, plus_in: 0.0625, minus_in: 0.0625}
    opening_families:
      # Suburban states these groupings directly. Capacity does NOT imply a distinct
      # opening: 10, 12 and 16 gallon all share one. One door PN spans all three.
      small: {opening_in: [12.75, 12.75], capacities_gal: [4, 6]}
      large: {opening_in: [16.375, 16.375], capacities_gal: [10, 12, 16]}
    tags: [plumbing, lp_gas, electrical, appliance]
    pcdb_term_id: null
    # TODO (ported from Walter's 2026-07-30 revision, terminology updated).
    # c_placeholder_wh_iw60rl below is a tankless on-demand unit with NO framed
    # opening at all — it mounts behind a panel and needs a 3.750in VENT HOLE.
    # The critical_attributes above therefore do not apply to it. It stays filed
    # under 412 because it is still "a water heater" for search purposes, but a
    # real implementation needs either a subtype or a second critical_attributes
    # set (vent_hole_diameter_in instead of opening_h/opening_w) before this type
    # is trusted for attribute-mode matching across the whole 412 population.
    #
    # Note this is now a THREE-way split within 412, not two:
    #   tank + framed opening  -> SW, SAW  (opening_h/opening_w)
    #   tankless + vent hole   -> IW       (vent_hole_diameter_in)
    #   and the opening_families rule above applies only to the first.
    # TODO: c_placeholder_wh_iw60rl (below) is a tankless on-demand unit with NO
    # cutout_h/w/d — critical_attributes above don't fit it. It's filed under 412
    # anyway because it's still "a water heater" for search purposes, but a real
    # implementation needs either a subtype or a second critical_attributes set
    # (vent_hole_diameter_in instead of cutout_*) before this type is trusted for
    # attribute-mode matching across the whole 412 population.

  - id: 415
    label: thermostat, analog wall
    compat_mode: proprietary_interface
    critical_attributes: [terminal_map, voltage, stages]
    tags: [climate, electrical]
    pcdb_term_id: null

  - id: 418
    label: ceiling register, round
    compat_mode: attribute_only
    critical_attributes: [duct_diameter, flange_diameter, depth]
    tags: [climate, interior]
    pcdb_term_id: null

  - id: 105
    label: roof vent, crank
    compat_mode: standard_opening
    critical_attributes: [opening_size]
    tags: [exterior, structural, climate]
    pcdb_term_id: null

  - id: 520
    label: monitor panel
    compat_mode: system_bound
    critical_attributes: [cutout_h, cutout_w, tank_channels, sensor_protocol]
    tags: [electrical, plumbing, interior]
    pcdb_term_id: null

  - id: 413
    label: water heater repair/service part
    compat_mode: fits_bracket
    # Generic internal service parts (thermostat valves, burners, orifices,
    # doors, gaskets...) that fit a BRACKET of many distinct water heater
    # models -- a many-to-many "fits" relationship, not a single-model
    # attribute set. See c_placeholder_wh_switch (412) for the earlier,
    # single-encounter TODO this resolves on the second (larger) encounter.
    critical_attributes: [description]
    tags: [plumbing, lp_gas, electrical, appliance, repair_part]
    pcdb_term_id: null

---

components:

