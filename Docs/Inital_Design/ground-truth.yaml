        now: 34.3
        source_was: "suburbanrvparts.com (obs #2)"
        source_now: "Suburban spec chart (obs #20)"
        note: >
          The retailer's FULL weight (82.6) matched the manufacturer exactly; only the empty
          figure was wrong. With 34.3, this record passes the corrected validity rule at
          0.965 — the original "DE record is suspect" finding was an artifact of a rule
          miscalibrated on a single datapoint. See VENDOR-Suburban.md 6.3.
        validity_now: pass

