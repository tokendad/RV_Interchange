# Ground-truth fixture
#
# Hand-written expected records for the five physically-in-hand parts.
# The pipeline must reproduce these. Write these BEFORE designing the schema —
# the schema is then "what shape holds these records."
#
# component_id values here are placeholders. Real IDs are opaque and assigned
# at ingest. What matters is the relationships, not the strings.
#
# Confidence values reflect the honest day-1 state: prior only, no field evidence.
#
# Date: 2026-07-29

part_types:
  - id: 412
    label: water heater
    compat_mode: attribute
    # CORRECTED 2026-07-30 by Suburban's Master Service and Training Manual (obs #19).
    # The installation opening is TWO-DIMENSIONAL. Figure 1 specifies A and B only —
    # there is no third cutout dimension. `cutout_d` was never a real attribute; both
    # retailers that published one were making a category error (see VENDOR-Suburban.md 6.5).
    critical_attributes: [opening_h, opening_w, capacity_gal, ignition_type]
    secondary_attributes: [unit_depth]   # cavity-depth constraint, NOT part of the opening
    tolerances:
      # Manufacturer-specified. Note the asymmetry on the small opening — an opening may
      # be oversize but must NEVER be undersize. A symmetric matcher would get this wrong.
      opening_4_6_gal:      {nominal_in: 12.75,  plus_in: 0.125, minus_in: 0.0}
      opening_10_12_16_gal: {nominal_in: 16.375, plus_in: 0.0625, minus_in: 0.0625}
    opening_families:
      # Suburban states these groupings directly. Capacity does NOT imply a distinct
      # opening: 10, 12 and 16 gallon all share one. One door PN spans all three.
      small: {opening_in: [12.75, 12.75], capacities_gal: [4, 6]}
      large: {opening_in: [16.375, 16.375], capacities_gal: [10, 12, 16]}
    tags: [plumbing, lp_gas, electrical, appliance]
    pcdb_term_id: null
    # TODO (ported from Walter's 2026-07-30 revision, terminology updated).
    # c_placeholder_wh_iw60rl below is a tankless on-demand unit with NO framed
    # opening at all — it mounts behind a panel and needs a 3.750in VENT HOLE.
    # The critical_attributes above therefore do not apply to it. It stays filed
    # under 412 because it is still "a water heater" for search purposes, but a
    # real implementation needs either a subtype or a second critical_attributes
    # set (vent_hole_diameter_in instead of opening_h/opening_w) before this type
    # is trusted for attribute-mode matching across the whole 412 population.
    #
    # Note this is now a THREE-way split within 412, not two:
    #   tank + framed opening  -> SW, SAW  (opening_h/opening_w)
    #   tankless + vent hole   -> IW       (vent_hole_diameter_in)
    #   and the opening_families rule above applies only to the first.
    # TODO: c_placeholder_wh_iw60rl (below) is a tankless on-demand unit with NO
    # cutout_h/w/d — critical_attributes above don't fit it. It's filed under 412
    # anyway because it's still "a water heater" for search purposes, but a real
    # implementation needs either a subtype or a second critical_attributes set
    # (vent_hole_diameter_in instead of cutout_*) before this type is trusted for
    # attribute-mode matching across the whole 412 population.

  - id: 415
    label: thermostat, analog wall
    compat_mode: proprietary_interface
    critical_attributes: [terminal_map, voltage, stages]
    tags: [climate, electrical]
    pcdb_term_id: null

  - id: 418
    label: ceiling register, round
    compat_mode: attribute_only
    critical_attributes: [duct_diameter, flange_diameter, depth]
    tags: [climate, interior]
    pcdb_term_id: null

  - id: 105
    label: roof vent, crank
    compat_mode: standard_opening
    critical_attributes: [opening_size]
    tags: [exterior, structural, climate]
    pcdb_term_id: null

  - id: 520
    label: monitor panel
    compat_mode: system_bound
    critical_attributes: [cutout_h, cutout_w, tank_channels, sensor_protocol]
    tags: [electrical, plumbing, interior]
    pcdb_term_id: null

---

components:

  # =========================================================================
  # 1. WATER HEATER — the anchor case. Best-documented, in-hand, measurable.
  # =========================================================================
  - component_id: c_placeholder_wh_6del
    part_type_id: 412
    interchange_code: 412-0087-A
    identifiers:
      - {ns: suburban, value: SW6DEL, visibility: exterior_plate}
      - {ns: suburban, value: "5240A", visibility: none_marked}
      - {ns: suburban, value: "5140A", visibility: none_marked}
      # 5240A current, 5140A legacy — see c_placeholder_wh_6de below for the
      # renumbering evidence (obs #22 vs obs #25); same +100 pattern applies here.
    attributes:
      capacity_gal:   {value: 6,     provenance: retailer_spec_block}
      input_btuh:     {value: 12000, provenance: data_plate}
      element_watts:  {value: 1440,  provenance: retailer_prose, conflict: true}
      ignition_type:  {value: direct_spark, provenance: data_plate}
      interior_relay: {value: true,  provenance: vendor_grammar}
      opening_h:      {value: 12.75, unit: in, provenance: manufacturer_pdf, tolerance: "+1/8 -0", source: "obs #19 Figure 1"}
      opening_w:      {value: 12.75, unit: in, provenance: manufacturer_pdf, tolerance: "+1/8 -0", source: "obs #19 Figure 1"}
      unit_depth:     {value: 19.1875, unit: in, provenance: manufacturer_spec_chart, source: "obs #20"}
      weight_empty:   {value: 36,    unit: lb, provenance: retailer_spec_block, validity: suspect}
      weight_full:    {value: 86.04, unit: lb, provenance: retailer_spec_block, validity: suspect}
      orifice:        {value: 61,    provenance: data_plate}
    retired_attributes:
      cutout_d:
        former_value: 19.19
        retired: 2026-07-30
        reason: >
          Not a real attribute. Suburban's master service manual specifies the installation
          opening as two dimensions (A x B) with no depth. Both retailers publishing a
          "cutout depth" were making a category error — one copied its own product depth
          (19.19), the other stated a cavity figure (19.75) under the wrong label. Replaced
          by opening_h/opening_w plus a separate unit_depth. See VENDOR-Suburban.md 6.5.
    conflicts:
      - field: element_watts
        values: [1400, 1440]
        resolved: true
        resolution: 1440
        resolved_by: >
          Manufacturer spec chart (obs #20) lists 12000/1440 on all fifteen rows.
          The 1400 figure in suburbanrvparts' spec block is wrong on every page.
      - field: weight_empty
        values: [36]
        note: >
          (86.04 - 36) / 8.34 / 6 = 1.000, against a manufacturer design constant of 0.971
          across 15 rows. SW6DEL is absent from the 2002 chart so this can't be checked
          directly, but 1.000 is an outlier, not a pass. See VENDOR-Suburban.md 6.3.
        resolved: false

  - component_id: c_placeholder_wh_6de
    part_type_id: 412
    interchange_code: 412-0087-B
    identifiers:
      - {ns: suburban, value: SW6DE, visibility: exterior_plate}
      - {ns: suburban, value: "5239A", visibility: none_marked}
      - {ns: suburban, value: "5139A", visibility: none_marked}
      # 5239A current, 5139A legacy — same 2023->2025 +100 SKU renumbering
      # confirmed for the whole D/DE/DEL line (obs #22 vs obs #25). See
      # VENDOR-Suburban.md §7.1.
    attributes:
      capacity_gal:   {value: 6,     provenance: retailer_spec_block}
      input_btuh:     {value: 12000, provenance: retailer_spec_block}
      ignition_type:  {value: direct_spark, provenance: retailer_spec_block}
      interior_relay: {value: false, provenance: vendor_grammar}
      opening_h:      {value: 12.75, unit: in, provenance: manufacturer_pdf, tolerance: "+1/8 -0", source: "obs #19 Figure 1"}
      opening_w:      {value: 12.75, unit: in, provenance: manufacturer_pdf, tolerance: "+1/8 -0", source: "obs #19 Figure 1"}
      unit_depth:     {value: 19.1875, unit: in, provenance: manufacturer_spec_chart, source: "obs #20"}
      weight_empty:   {value: 34.3,  unit: lb, provenance: manufacturer_spec_chart, source: "obs #20", supersedes: 37.4}
      weight_full:    {value: 82.6,  unit: lb, provenance: manufacturer_spec_chart, source: "obs #20"}
      element_watts:  {value: 1440,  provenance: manufacturer_spec_chart, source: "obs #20"}
      recovery_gas_gph:      {value: 10.2, provenance: manufacturer_spec_chart}
      recovery_electric_gph: {value: 6.0,  provenance: manufacturer_spec_chart}
    retired_attributes:
      cutout_d:
        former_value: 19.19
        retired: 2026-07-30
        reason: "See c_placeholder_wh_6del — same correction, same opening family."
    corrections:
      - field: weight_empty
        was: 37.4
        now: 34.3
        source_was: "suburbanrvparts.com (obs #2)"
        source_now: "Suburban spec chart (obs #20)"
        note: >
          The retailer's FULL weight (82.6) matched the manufacturer exactly; only the empty
          figure was wrong. With 34.3, this record passes the corrected validity rule at
          0.965 — the original "DE record is suspect" finding was an artifact of a rule
          miscalibrated on a single datapoint. See VENDOR-Suburban.md 6.3.
        validity_now: pass

  # -- interior switch: cosmetic axis, colour only -------------------------
  - component_id: c_placeholder_wh_switch
    part_type_id: 412   # TODO: likely wants its own type on second encounter
    interchange_code: 412-0091-A
    identifiers:
      - {ns: suburban, value: "232882", visibility: exterior_plate}
      - {ns: suburban, value: "233111", visibility: exterior_plate}
      - {ns: suburban, value: "232881", visibility: exterior_plate}
    display_axis:
      colour:
        "232882": white
        "233111": black
        "232881": cream
    note: >
      One component, three part numbers, colour-only difference.
      Colour is NOT part of the interchange key.

  # -- NOT one of the five in-hand parts. Vendor-researched only (SKU 5248A),
  # included solely as the target of the cross-capacity evidence edge below.
  # Do not treat this as fixture-complete the way the five in-hand parts are.
  - component_id: c_placeholder_wh_12del
    part_type_id: 412
    interchange_code: 412-0088-A   # different group from 412-0087 — different cutout
    identifiers:
      - {ns: suburban, value: SW12DEL, visibility: exterior_plate}
      - {ns: suburban, value: "5248A", visibility: none_marked}
      - {ns: suburban, value: "5148A", visibility: none_marked}
      # Both co-current, not legacy/current — manufacturer-confirmed 2026-07-31
      # (obs #35, direct email from Suburban): 5148A is the manufacturer-channel
      # SKU, 5248A is the distributor-channel SKU, same physical unit, packaging
      # difference only. Supersedes the earlier 2026-07-30 (obs #25) reading of
      # this pair as a legacy→current renumbering. VENDOR-Suburban.md §7.2 has
      # the full evidence trail; §7.1 documents the now-superseded reasoning.
    attributes:
      capacity_gal:  {value: 12,    provenance: retailer_spec_block}
      input_btuh:    {value: 12000, provenance: retailer_spec_block}
      element_watts: {value: [1400, 1440], provenance: retailer_spec_block, conflict: true}
      cutout_h:      {value: 16.38, unit: in, provenance: retailer_spec_block}
      cutout_w:      {value: 16.38, unit: in, provenance: retailer_spec_block}
      cutout_d:      {value: 22.25, unit: in, provenance: retailer_spec_block}
      weight_empty:  {value: 48.0,  unit: lb, provenance: retailer_spec_block}
      weight_full:   {value: 148.08, unit: lb, provenance: retailer_spec_block}
    note: >
      Vendor-researched sibling, not physically in hand. Exists in this fixture
      only because a real customer review on its product page ties it to
      c_placeholder_wh_6del via a confirmed field substitution — see the
      cross-capacity edge below.

  # -- NOT one of the five in-hand parts. Vendor-researched only. Tankless
  # platform, structurally different from every other 412 in this fixture —
  # see the part_type_id: 412 TODO above. Included because the manufacturer's
  # own service manual documents it as a retrofit target for FOUR existing
  # tank-unit cutout families (two of them Suburban's own, two Atwood's) —
  # see the substitutes edges below, obs #14.
  - component_id: c_placeholder_wh_iw60rl
    part_type_id: 412
    interchange_code: 412-0089-A   # own group — tankless, no cutout, not comparable to 412-0087/0088
    identifiers:
      - {ns: suburban, value: IW60RL, visibility: exterior_plate}
      - {ns: suburban, value: "5280A", visibility: none_marked}
    attributes:
      tankless:              {value: true, provenance: retailer_spec_block}
      capacity_gal:          {value: 0.5,  provenance: retailer_spec_block}
      input_btuh:            {value: 60000, provenance: retailer_spec_block}
      ignition_type:         {value: direct_spark, provenance: retailer_spec_block}
      vent_hole_diameter_in: {value: 3.750, unit: in, provenance: manufacturer_pdf}
      product_size_h:        {value: 12.5, unit: in, provenance: retailer_spec_block}
      product_size_w:        {value: 12.5, unit: in, provenance: retailer_spec_block}
      product_size_d:        {value: 20.0, unit: in, provenance: manufacturer_pdf, note: "retailer_spec_block agrees exactly — cross-source corroboration"}
      weight_empty:          {value: 36,   unit: lb, provenance: retailer_spec_block}
    note: >
      No cutout_h/w/d — genuinely doesn't have one (confirmed via manufacturer
      service manual, obs #14, not just an unfetched attribute). Only opening
      required for a fresh install is the 3.750in vent hole. For a retrofit
      into an existing tank unit's opening, see the substitutes edges below —
      those require a replacement panel (part number varies by target) plus
      the vent hole, not a cutout resize.

  # -- Atwood entries: FIRST non-Suburban components in this fixture. Not
  # specific models — Suburban's own Nautilus manual (obs #14) names its
  # retrofit-panel targets by brand + capacity only, not by SKU. Zero
  # Atwood-specific research otherwise. Treat as manufacturer-asserted
  # family placeholders, not verified components, until a real Atwood
  # product page exists.
  - component_id: c_placeholder_wh_atwood_6gal
    part_type_id: 412
    interchange_code: null   # not yet classified — family-level placeholder only
    identifiers: []
    attributes:
      capacity_gal: {value: 6, provenance: manufacturer_pdf}
      brand:        {value: Atwood, provenance: manufacturer_pdf}
    note: >
      Represents "any Atwood 6-gallon tank water heater" as named generically
      in obs #14 (Suburban's Nautilus service manual), which specs replacement
      panel 521147 for this whole capacity family rather than one SKU.

  - component_id: c_placeholder_wh_atwood_10gal
    part_type_id: 412
    interchange_code: null   # not yet classified — family-level placeholder only
    identifiers: []
    attributes:
      capacity_gal: {value: 10, provenance: manufacturer_pdf}
      brand:        {value: Atwood, provenance: manufacturer_pdf}
    note: >
      Represents "any Atwood 10-gallon tank water heater" as named generically
      in obs #14 (Suburban's Nautilus service manual), which specs replacement
      panel 521150 for this whole capacity family rather than one SKU.

  # =========================================================================
  # 2. THERMOSTAT — multi-namespace identity; the crosswalk proof case
  # =========================================================================
  - component_id: c_placeholder_tstat
    part_type_id: 415
    interchange_code: 415-0012-A
    identifiers:
      - {ns: icm,        value: AP7862-3,   visibility: behind_faceplate}
      - {ns: icm,        value: AR7815,     visibility: behind_faceplate}
      - {ns: icm,        value: AR7816,     visibility: behind_faceplate}
      - {ns: silkscreen, value: PCB1060-4A, visibility: behind_faceplate}
      - {ns: silkscreen, value: SPCB-2,     visibility: behind_faceplate}
      - {ns: coleman,    value: "7330G335", visibility: none_marked}
    attributes:
      terminal_map: {value: [W1, W5, W6, W3, W4, W2], provenance: in_hand}
      brand_facing: {value: Coleman-Mach, provenance: retailer_prose}
    note: >
      THE MISSING-CROSSWALK PROOF. A retailer lists AP7862 and AR7815 as two
      separate products at different prices (~$57 vs ~$77). They are the same
      part. Compat key here is the terminal map, NOT dimensions.
    todo:
      - Confirm which identifiers are supersessions vs pure aliases
      - Capture full terminal-to-function mapping

  # =========================================================================
  # 3. MONITOR PANEL — system-bound; assembly decomposition case
  # =========================================================================
  - component_id: c_placeholder_monitor
    part_type_id: 520
    interchange_code: 520-0004-A
    identifiers:
      - {ns: kib, value: M21VW, visibility: behind_faceplate}
    attributes:
      cutout_h:       {value: 2.75, unit: in, provenance: in_hand_measured}
      cutout_w:       {value: 4.5,  unit: in, provenance: in_hand_measured}
      tank_channels:  {value: [fresh, grey, black, battery], provenance: in_hand}
      pump_switch:    {value: true, provenance: in_hand}
    assembly_level: full_panel
    contains:
      - {ns: kib, value: SUBPCBM21, role: bare_board}
      - {ns: kib, value: SWOKLED1,  role: pump_switch}
      - {ns: kib, value: K101,      role: harness}
      - {ns: kib, value: MP5,       role: tank_sensors}
    edges:
      - {type: requires_system, target: kib_sensor_protocol}
      - {type: aftermarket_replaces, source: RecPro M21, trust: low}
      - {type: aftermarket_replaces, source: RecPro M23, trust: low}
      - {type: aftermarket_replaces, source: RecPro M28, trust: low}
    note: >
      Five distinct transactions can all be described as "a KIB monitor panel."
      assembly_level MUST be declared per listing.

  # =========================================================================
  # 4. ROOF VENT — standard opening; large brand-agnostic group
  # =========================================================================
  - component_id: c_placeholder_vent
    part_type_id: 105
    interchange_code: 105-0001-A
    identifiers: []
    identifier_visibility: hidden_mold_face
    attributes:
      opening_size: {value: "14x14", unit: in, provenance: in_hand_measured}
      actuation:    {value: crank,   provenance: in_hand}
    note: >
      Unbranded as installed. Part numbers on this class are typically molded
      on INTERIOR surfaces — visible only at teardown. This is the flagship
      case for correlating hidden identifiers against externally-visible
      features (garnish profile, hinge, crank style) so a buyer who cannot
      see a number still gets an answer.
    todo:
      - Teardown capture; classify every molded string before ingest
        (part_number | cavity_id | resin_code | date_wheel | unknown)

  # =========================================================================
  # 5. CEILING REGISTER — attribute_only; identity is pure geometry
  # =========================================================================
  - component_id: c_placeholder_register
    part_type_id: 418
    interchange_code: 418-0001-A
    identifiers:
      # No marking on the physical part itself. This identifier is a
      # manufacturer/model MATCH BY GEOMETRY + retailer corroboration, not a
      # marking read off the unit — visibility reflects that honestly.
      - {ns: dwin, value: RO-9850, visibility: unmarked_geometry_match}
    identifier_visibility: none_marked
    attributes:
      duct_diameter:   {value: 5.0,  unit: in, provenance: in_hand_measured, source: "obs #36", tolerance_note: "catalog spec (obs #37) states 5-1/8in; in-hand tape reading against a molded/flashed edge reads ~5in — within measurement error, not treated as a conflict"}
      flange_diameter: {value: 7.0,  unit: in, provenance: in_hand_measured, source: "obs #36", tolerance_note: "matches catalog spec (obs #37) of a 7in exterior mounting flange essentially exactly"}
      depth:           {value: 1.875, unit: in, provenance: manufacturer_spec_via_retailer, source: "obs #37", note: "duct spud depth, not independently re-measured in-hand — carried from the corroborating catalog spec, flagged for confirmation"}
      shape:            {value: round, provenance: in_hand}
      actuation:        {value: rotatable_louvers_always_open, provenance: in_hand, source: "obs #36"}
      colour:           {value: white, provenance: in_hand}   # display axis only
    note: >
      No markings anywhere on the physical part — same "identity is pure
      geometry" case this fixture entry was written to anchor. Resolved via
      photographed tape measurements (obs #36: ~5in duct spud, ~6.75-7in
      flange, round, always-open rotatable-louver style) matched against
      D&W International's (dwincorp.com) RO-9850 round plastic grille, whose
      published specs (obs #37, a retailer spec block — dwincorp's own
      listing page, obs #38, names the model but publishes no dimensions)
      are a near-exact match: 5in nominal / 5-1/8in duct, 7in flange,
      1-7/8in spud depth, rotatable-louver-always-open. `duct_diameter` and
      `flange_diameter` are the two in-hand-measured, decision-critical
      attributes for this part_type; `depth` is carried from the
      corroborating spec pending a direct in-hand re-check. Confidence is
      geometry-match, not marking-read — see identifier visibility above.
    confidence:
      note: >
        Model identification (RO-9850) rests on dimensional + feature match
        to one retailer's spec block, not a manufacturer spec sheet with
        dimensions (dwincorp's own page lists the model but no numbers) and
        not any marking on the part. Treat as CANDIDATE tier for the
        identifier; the geometry attributes themselves (duct_diameter,
        flange_diameter) are in_hand_measured and don't depend on the ID
        being right.

---

edges:

  # THE CANONICAL EDGE TEST. Asymmetric substitution, confirmed real.
  - type: substitutes
    a: c_placeholder_wh_6de
    b: c_placeholder_wh_6del
    group: 412-0087
    asymmetric: true
    basis: attribute_match_exact   # cutout, capacity, BTU, ignition all identical
    confidence:
      alpha: 3
      beta: 1
      value: 0.75
      certainty: 4
      note: prior only — zero field evidence. CANDIDATE tier.
    a_to_b:
      verdict: drop_in
      caveats: []
      note: functional upgrade; gains interior electric switching
    b_to_a:
      verdict: fits_with_caveat
      caveats:
        - blocking: true
          text: >
            The interior wall switch will stop working. The 12V relay it
            controls is not present on the SW6DE.
          becomes_input: "Do you have an interior electric switch? [yes/no]"

  - type: controls
    a: c_placeholder_wh_switch
    b: c_placeholder_wh_6del
    note: >
      Sold separately. Buyer needs it but does not know to ask.
      Surfaces in the PARTS FOR THIS UNIT tier.

  - type: alias
    members:
      - {ns: icm, value: AP7862-3}
      - {ns: icm, value: AR7815}
    basis: retailer_cross_reference
    confidence:
      alpha: 2
      beta: 1
      note: >
        Retailer sells these as separate products at different prices.
        Cross-reference is the only evidence. Needs a teardown or a
        buyer confirmation before it can leave CANDIDATE.

  # FIRST EDGE WITH REAL FIELD EVIDENCE — not prior-only. A genuine customer
  # review, found by accident while checking a different fact, is exactly the
  # "buyer-confirmed install" evidence event the confidence model was built for.
  - type: substitutes
    a: c_placeholder_wh_6del
    b: c_placeholder_wh_12del
    group: cross_capacity_upgrade  # NOT the same interchange group — different cutout
    asymmetric: true
    basis: buyer_confirmed_install
    source: >
      Customer review, John Harmon, 2021-08-30, on suburbanrvparts.com's SW12DEL
      product page (5248A). Found while cross-checking SW16VE facts — not sought
      out, which is itself worth noting per PLAN-Staged_Build.md §6.4 ("free
      negative/positive signals arrive without asking").
    confidence:
      alpha: 4          # prior Beta(1,1) unknown/incomplete + buyer-confirmed install (+3)
      beta: 1
      value: 0.80
      certainty: 5
      note: >
        Still n=1 — one confirmed install is not a verified tier (needs n>=8 per
        ARCHITECTURE-Interchange_Core.md §8). But it is no longer CANDIDATE-by-prior-
        alone; this is the fixture's first edge with an actual evidence event behind it.
    a_to_b:
      verdict: fits_with_modification
      caveats:
        - blocking: true
          text: >
            Cutout must be enlarged from 12.75x12.75 to 16.38x16.38. This is not a
            same-group substitution — capacities and cutouts differ. Framed here as
            an intentional upgrade path, not an interchange match.
        - blocking: false
          text: "Bypass line needs to be lengthened."
      note: >
        Confirmed real-world case: gas lit on second attempt, buyer reports "operates
        as described." One data point for a broader open question — does this
        modification path generalize (any smaller SW6xxx accepting a larger cutout),
        or is it specific to this pair? Not yet enough evidence to say.
    b_to_a:
      verdict: not_observed
      caveats: []
      note: "No case found of someone shrinking a 12-gallon cutout down to 6-gallon."

  # FIRST MANUFACTURER-DOCUMENTED EDGES, AND FIRST CROSS-VENDOR (non-Suburban)
  # EDGES IN THIS FIXTURE. Source is Suburban/Airxcel's own Nautilus (IW60)
  # service manual (obs #14), not a retailer page or a buyer anecdote — the
  # manufacturer directly specs a retrofit path from four existing tank-unit
  # cutout families onto the tankless IW60RL via a replacement panel (PN
  # varies by target) plus a newly-cut 3.750in vent hole. Stronger evidence
  # class than buyer_confirmed_install above: this is the vendor asserting
  # supported compatibility with a stocked part number, not one buyer's
  # single successful install. Still not "verified" tier (ARCHITECTURE-
  # Interchange_Core.md §8 requires n>=8 real installs) — manufacturer intent
  # and field-confirmed frequency are different kinds of evidence.

  - type: substitutes
    a: c_placeholder_wh_6del
