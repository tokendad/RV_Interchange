  # 1. WATER HEATER — the anchor case. Best-documented, in-hand, measurable.
  # =========================================================================
  - component_id: c_placeholder_wh_6del
    part_type_id: 412
    interchange_code: 412-0087-A
    identifiers:
      - {ns: suburban, value: SW6DEL, visibility: exterior_plate}
      - {ns: suburban, value: "5240A", visibility: none_marked}
      - {ns: suburban, value: "5140A", visibility: none_marked}
      # 5240A current, 5140A legacy — see c_placeholder_wh_6de below for the
      # renumbering evidence (obs #22 vs obs #25); same +100 pattern applies here.
    attributes:
      capacity_gal:   {value: 6,     provenance: retailer_spec_block}
      input_btuh:     {value: 12000, provenance: data_plate}
      element_watts:  {value: 1440,  provenance: retailer_prose, conflict: true}
      ignition_type:  {value: direct_spark, provenance: data_plate}
      interior_relay: {value: true,  provenance: vendor_grammar}
      opening_h:      {value: 12.75, unit: in, provenance: manufacturer_pdf, tolerance: "+1/8 -0", source: "obs #19 Figure 1"}
      opening_w:      {value: 12.75, unit: in, provenance: manufacturer_pdf, tolerance: "+1/8 -0", source: "obs #19 Figure 1"}
      unit_depth:     {value: 19.1875, unit: in, provenance: manufacturer_spec_chart, source: "obs #20"}
      weight_empty:   {value: 36,    unit: lb, provenance: retailer_spec_block, validity: suspect}
      weight_full:    {value: 86.04, unit: lb, provenance: retailer_spec_block, validity: suspect}
      orifice:        {value: 61,    provenance: data_plate}
    retired_attributes:
      cutout_d:
        former_value: 19.19
        retired: 2026-07-30
        reason: >
          Not a real attribute. Suburban's master service manual specifies the installation
          opening as two dimensions (A x B) with no depth. Both retailers publishing a
          "cutout depth" were making a category error — one copied its own product depth
          (19.19), the other stated a cavity figure (19.75) under the wrong label. Replaced
          by opening_h/opening_w plus a separate unit_depth. See VENDOR-Suburban.md 6.5.
    conflicts:
      - field: element_watts
        values: [1400, 1440]
        resolved: true
        resolution: 1440
        resolved_by: >
          Manufacturer spec chart (obs #20) lists 12000/1440 on all fifteen rows.
          The 1400 figure in suburbanrvparts' spec block is wrong on every page.
      - field: weight_empty
        values: [36]
        note: >
          (86.04 - 36) / 8.34 / 6 = 1.000, against a manufacturer design constant of 0.971
          across 15 rows. SW6DEL is absent from the 2002 chart so this can't be checked
          directly, but 1.000 is an outlier, not a pass. See VENDOR-Suburban.md 6.3.
        resolved: false

