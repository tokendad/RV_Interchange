      unit_depth:     {value: 19.1875, unit: in, provenance: manufacturer_spec_chart, source: "obs #20"}
      weight_empty:   {value: 34.3,  unit: lb, provenance: manufacturer_spec_chart, source: "obs #20", supersedes: 37.4}
      weight_full:    {value: 82.6,  unit: lb, provenance: manufacturer_spec_chart, source: "obs #20"}
      element_watts:  {value: 1440,  provenance: manufacturer_spec_chart, source: "obs #20"}
      recovery_gas_gph:      {value: 10.2, provenance: manufacturer_spec_chart}
      recovery_electric_gph: {value: 6.0,  provenance: manufacturer_spec_chart}
    retired_attributes:
      cutout_d:
        former_value: 19.19
        retired: 2026-07-30
        reason: "See c_placeholder_wh_6del — same correction, same opening family."
    corrections:
