name: rvinterchange

services:
  rvinterchange-api:
    container_name: rvinterchange-api
    build:
      context: ..
      dockerfile: api/Dockerfile
    image: rvinterchange-api:latest
    restart: unless-stopped
    environment:
      TZ: America/New_York
      RVI_LOG_DIR: /app/logs
    volumes:
      - ../Docs/Tools:/app/Docs/Tools:ro
      - /data/DockerConfigs/RVInterchange/logs:/app/logs
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8484/health/')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  rvinterchange-web:
    container_name: rvinterchange-web
    build:
      context: ../web
      dockerfile: Dockerfile
    image: rvinterchange-web:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8485:80"
    depends_on:
      rvinterchange-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  rvinterchange-review:
    container_name: rvinterchange-review
    build:
      context: ..
      dockerfile: review/Dockerfile
    image: rvinterchange-review:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8486:80"
    depends_on:
      rvinterchange-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  rvinterchange-cloudflared:
    container_name: rvinterchange-cloudflared
    image: cloudflare/cloudflared:2026.7.2
    restart: unless-stopped
    profiles: ["tunnel"]
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${RVINTERCHANGE_TUNNEL_TOKEN:-}
    depends_on:
      rvinterchange-web:
        condition: service_healthy
      rvinterchange-review:
        condition: service_healthy

  rvinterchange-intake:
    build:
      context: ..
      dockerfile: intake/Dockerfile
    image: rvinterchange-intake:latest
    restart: unless-stopped
    profiles: ["intake"]
    environment:
      TZ: America/New_York
      RVI_INTAKE_DB_PATH: /app/data/submissions.db
      RVI_ARTIFACT_ROOT: /app/artifacts
      RVI_CONTACT_KEY_FILE: /run/secrets/contact_key
      RVI_TOKEN_KEY_FILE: /run/secrets/token_key
      RVI_SESSION_KEY_FILE: /run/secrets/session_key
      RVI_IP_KEY_FILE: /run/secrets/ip_key
      RVI_TURNSTILE_SECRET_FILE: /run/secrets/turnstile_secret
      RVI_TRUST_CF_CONNECTING_IP: "false"
    volumes:
      - ${RVI_INTAKE_DATA_DIR:-/data/DockerConfigs/RVInterchange/intake/data}:/app/data
      - ${RVI_INTAKE_ARTIFACT_DIR:-/data/DockerConfigs/RVInterchange/intake/artifacts}:/app/artifacts
    secrets:
      - source: intake_contact_key
        target: contact_key
      - source: intake_token_key
        target: token_key
      - source: intake_session_key
        target: session_key
      - source: intake_ip_key
        target: ip_key
      - source: intake_turnstile_secret
        target: turnstile_secret
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8487/health/')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

secrets:
  intake_contact_key:
    file: ${RVI_CONTACT_KEY_FILE:-/data/DockerConfigs/RVInterchange/intake/secrets/contact_key}
  intake_token_key:
    file: ${RVI_TOKEN_KEY_FILE:-/data/DockerConfigs/RVInterchange/intake/secrets/token_key}
  intake_session_key:
    file: ${RVI_SESSION_KEY_FILE:-/data/DockerConfigs/RVInterchange/intake/secrets/session_key}
  intake_ip_key:
    file: ${RVI_IP_KEY_FILE:-/data/DockerConfigs/RVInterchange/intake/secrets/ip_key}
  intake_turnstile_secret:
    file: ${RVI_TURNSTILE_SECRET_FILE:-/data/DockerConfigs/RVInterchange/intake/secrets/turnstile_secret}
